[project]
name = "enterprise-rag-assistant"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "PyJWT>=2.9",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "google-genai>=1.0",
    "httpx>=0.27",
    "email-validator>=2.2",
    "ragas==0.4.3",
    "langchain-community==0.3.31",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires PostgreSQL with pgvector"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"app/api/v1/routes.py" = ["B008", "B904", "E501"]
"app/core/security.py" = ["B008"]
"app/models/__init__.py" = ["F401"]
"migrations/*.py" = ["E501", "I001", "F401"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["migrations*", "tests*"]